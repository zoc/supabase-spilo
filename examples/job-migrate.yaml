# Applies migrations that appeared in the image since the database was
# bootstrapped. Run this after rolling the cluster onto a newer image --
# Patroni invokes the bootstrap only at initdb, so nothing else will.
#
# Safe to run when there is nothing to do: it reports "no pending migrations"
# and exits 0. Under Flux, give it a name that changes with the image tag (or
# annotate it) so a new image produces a new Job rather than a no-op.
apiVersion: batch/v1
kind: Job
metadata:
  name: supabase-db-migrate
  namespace: supabase
spec:
  # No retries. A failed migration wants a human reading the log, not a pod
  # reapplying half-applied DDL on a loop. It is resumable by design: rerun the
  # Job once the cause is understood.
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: migrate
        # MUST match the image the cluster now runs -- that is where the
        # migrations come from.
        image: docker.io/fzoc/supabase-spilo:18
        command: ["/scripts/migrate.sh"]
        # Add --dry-run first if you want to see the delta before applying it.
        # args: ["--dry-run"]
        env:
        # The <cluster> service points at the leader; <cluster>-repl points at
        # replicas, and migrate.sh refuses to run against one.
        - name: PGHOST
          value: supabase-db.supabase.svc.cluster.local
        - name: PGPORT
          value: "5432"
        - name: PGDATABASE
          value: postgres
        - name: PGUSER
          value: postgres
        # Generated by the operator, named
        # <username>.<cluster>.credentials.postgresql.acid.zalan.do
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres.supabase-db.credentials.postgresql.acid.zalan.do
              key: password
        # Spilo's pg_hba rejects non-TLS off-localhost unless you have relaxed
        # it (see postgresql-supabase-db.yaml). sslmode=require, not
        # verify-full: Spilo's certificate is self-signed with no CA to trust.
        - name: PGSSLMODE
          value: require
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          runAsNonRoot: true
          runAsUser: 101
          capabilities:
            drop: ["ALL"]
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
